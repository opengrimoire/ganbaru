[package]
name = "ganbaru-tauri-app"
version = "0.1.5"
description = "Ganbaru AI Tauri application composition"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
ganbaru-calendar = { workspace = true }
ganbaru-chat-contracts = { workspace = true }
ganbaru-chat = { workspace = true }
ganbaru-civil-time = { workspace = true }
ganbaru-db = { workspace = true }
ganbaru-distractions = { workspace = true }
ganbaru-handoff = { workspace = true }
ganbaru-music = { workspace = true }
ganbaru-music-library = { workspace = true }
ganbaru-notes = { workspace = true }
ganbaru-contacts = { workspace = true }
ganbaru-pomodoro = { workspace = true }
ganbaru-projects = { workspace = true }
ganbaru-quick-notes = { workspace = true }
ganbaru-sync = { workspace = true }
ganbaru-sync-contracts = { workspace = true }
ganbaru-sync-replica = { workspace = true }
ganbaru-themes = { workspace = true }
ganbaru-working-folders = { workspace = true }
jiff = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
zip = { workspace = true }

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
libc = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
axum = { workspace = true }
ganbaru-chat = { workspace = true, features = ["native-runtime"] }
ganbaru-chat-providers = { workspace = true }
ganbaru-music-player = { workspace = true }
keyring = { workspace = true }
notify = { workspace = true }
notify-rust = { workspace = true }
portable-pty = { workspace = true }
rmcp = { workspace = true }
rodio = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
ganbaru-mobile-documents = { workspace = true }
ganbaru-mobile-distractions = { workspace = true }
ganbaru-mobile-media = { workspace = true }
ganbaru-mobile-notifications = { workspace = true }
tauri-plugin-notification = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { workspace = true }
gtk = { workspace = true }
webkit2gtk = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols-wlr = { workspace = true }
x11rb = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = { workspace = true }
windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-foundation = { workspace = true }
objc2-web-kit = { workspace = true }

[dev-dependencies]
ganbaru-chat = { workspace = true, features = ["test-support"] }
ganbaru-handoff = { workspace = true, features = ["test-support"] }
