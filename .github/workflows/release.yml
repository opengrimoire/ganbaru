name: release

on:
  release:
    types:
      - published
  push:
    tags:
      - "app-v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-release:
    if: github.event_name != 'release'
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    # Each matrix leg sets only its own key, so both digests reach the signing job.
    outputs:
      linux-x64: ${{ steps.digest.outputs.linux-x64 }}
      windows-x64: ${{ steps.digest.outputs.windows-x64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x64
            runner: ubuntu-22.04
            artifact: linux-x64
          - name: windows x64
            runner: windows-2022
            artifact: windows-x64
    env:
      CARGO_TERM_COLOR: always
      GANBARU_RELEASE_REPOSITORY: ${{ github.repository }}
      GANBARU_PACKAGE_REPO_PUBLIC_KEY: ${{ vars.GANBARU_PACKAGE_REPO_PUBLIC_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        # actions/setup-node v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: validate release metadata
        run: node apps/client/scripts/release/resolve-release-metadata.mjs

      - name: enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install

      - name: install pinned Rust toolchain
        run: rustup show

      - name: install Linux dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: fetch Rust dependencies
        run: cargo fetch --locked

      - name: write release updater config
        run: node apps/client/scripts/release/write-tauri-release-config.mjs

      - name: build Linux firewall helper
        if: matrix.runner == 'ubuntu-22.04'
        run: cargo build --release --locked -p ganbaru-linking-firewall

      - name: build release bundle
        run: pnpm --dir apps/client tauri build --config src-tauri/tauri.release.conf.json -- --locked

      - name: stage release assets
        run: node apps/client/scripts/release/stage-tauri-release-assets.mjs

      - name: record asset digest
        id: digest
        run: node apps/client/scripts/release/release-asset-digests.mjs record dist/release-assets ${{ matrix.artifact }}

      - name: upload unsigned assets
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-${{ matrix.artifact }}
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    if: github.event_name != 'release'
    name: build android
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      android: ${{ steps.digest.outputs.android }}
    env:
      CARGO_TERM_COLOR: always
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
      ANDROID_NDK_VERSION: "30.0.15729638"
      # Published SHA-256 of the command line tools archive (developer.android.com/studio).
      ANDROID_COMMAND_LINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
      ANDROID_COMMAND_LINE_TOOLS_SHA256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
      GANBARU_ANDROID_UNSIGNED_RELEASE: "true"
    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        # actions/setup-node v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: install Java 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"

      - name: enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install

      - name: install pinned Rust toolchain and Android targets
        run: |
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: install Android command line tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          command_line_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$command_line_tools/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL "$ANDROID_COMMAND_LINE_TOOLS_URL" -o "$RUNNER_TEMP/android-commandline-tools.zip"
            echo "$ANDROID_COMMAND_LINE_TOOLS_SHA256  $RUNNER_TEMP/android-commandline-tools.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            set +o pipefail
            yes | "$command_line_tools/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1
            set -o pipefail
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$command_line_tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: install pinned Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: fetch Rust dependencies
        run: cargo fetch --locked

      - name: build unsigned Android release
        run: pnpm --dir apps/client tauri android build --ci

      - name: stage Android release assets
        run: node apps/client/scripts/release/stage-android-release-assets.mjs

      - name: record asset digest
        id: digest
        run: node apps/client/scripts/release/release-asset-digests.mjs record dist/release-assets android

      - name: upload unsigned assets
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-android
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 7

  # Builds the self-hosted relay as a static musl binary on a native runner for each
  # architecture, so no cross toolchain is needed. The binaries join the signed SHA256SUMS like
  # every other release asset.
  build-relay:
    if: github.event_name != 'release'
    name: build relay ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    # Each matrix leg sets only its own key, so both digests reach the signing job.
    outputs:
      relay-linux-x64: ${{ steps.digest.outputs.relay-linux-x64 }}
      relay-linux-arm64: ${{ steps.digest.outputs.relay-linux-arm64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset_arch: x86_64
            artifact: relay-linux-x64
          - name: linux arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset_arch: aarch64
            artifact: relay-linux-arm64
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        # actions/setup-node v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: validate release metadata
        id: release
        run: node apps/client/scripts/release/resolve-release-metadata.mjs

      - name: install pinned Rust toolchain and musl target
        env:
          RELAY_TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "$RELAY_TARGET"

      - name: install musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools file

      - name: fetch Rust dependencies
        run: cargo fetch --locked

      - name: build static relay
        env:
          RELAY_TARGET: ${{ matrix.target }}
        run: |
          # ring and the bundled SQLite compile C code, which must target musl as well.
          target_env="$(printf '%s' "$RELAY_TARGET" | tr '-' '_')"
          export "CC_${target_env}=musl-gcc"
          cargo build --release --locked -p ganbaru-sync-relay --target "$RELAY_TARGET"

      - name: stage relay asset
        env:
          RELAY_TARGET: ${{ matrix.target }}
          RELAY_ASSET_ARCH: ${{ matrix.asset_arch }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          binary="target/$RELAY_TARGET/release/ganbaru-sync-relay"
          description="$(file -b "$binary")"
          echo "$description"
          case "$description" in
            *"statically linked"* | *"static-pie linked"*) ;;
            *)
              echo "The relay binary is not statically linked"
              exit 1
              ;;
          esac
          if [ -z "$RELEASE_VERSION" ]; then
            echo "Release metadata did not resolve a version"
            exit 1
          fi
          mkdir -p dist/relay-assets
          cp "$binary" "dist/relay-assets/ganbaru-sync-relay_${RELEASE_VERSION}_linux_${RELAY_ASSET_ARCH}"

      - name: record asset digest
        id: digest
        run: node apps/client/scripts/release/release-asset-digests.mjs record dist/relay-assets ${{ matrix.artifact }}

      - name: upload unsigned assets
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-${{ matrix.artifact }}
          path: dist/relay-assets/*
          if-no-files-found: error
          retention-days: 7

  # Holds the signing secrets. It must not install workspace dependencies or run builds, so code
  # from the dependency graph never shares a runner with the keys; check-signing-isolation.mjs
  # enforces this.
  sign-release:
    if: github.event_name != 'release'
    name: sign release assets
    needs:
      - build-release
      - build-android
      - build-relay
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    env:
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
      # Published SHA-256 of the command line tools archive (developer.android.com/studio).
      ANDROID_COMMAND_LINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
      ANDROID_COMMAND_LINE_TOOLS_SHA256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        # actions/setup-node v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: install Java 21 and RPM signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk rpm
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: install Android build tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          command_line_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "$ANDROID_COMMAND_LINE_TOOLS_URL" -o "$RUNNER_TEMP/android-commandline-tools.zip"
          echo "$ANDROID_COMMAND_LINE_TOOLS_SHA256  $RUNNER_TEMP/android-commandline-tools.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          set +o pipefail
          yes | "$command_line_tools/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1
          set -o pipefail
          "$command_line_tools/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;$ANDROID_BUILD_TOOLS_VERSION"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: download unsigned Linux assets
        # actions/download-artifact v7.0.0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: unsigned-linux-x64
          path: dist/unsigned/unsigned-linux-x64

      - name: download unsigned Windows assets
        # actions/download-artifact v7.0.0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: unsigned-windows-x64
          path: dist/unsigned/unsigned-windows-x64

      - name: download unsigned Android assets
        # actions/download-artifact v7.0.0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: unsigned-android
          path: dist/unsigned/unsigned-android

      - name: download unsigned relay x64 assets
        # actions/download-artifact v7.0.0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: unsigned-relay-linux-x64
          path: dist/unsigned/unsigned-relay-linux-x64

      - name: download unsigned relay arm64 assets
        # actions/download-artifact v7.0.0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: unsigned-relay-linux-arm64
          path: dist/unsigned/unsigned-relay-linux-arm64

      - name: verify unsigned asset digests
        env:
          DIGEST_UNSIGNED_LINUX_X64: ${{ needs.build-release.outputs.linux-x64 }}
          DIGEST_UNSIGNED_WINDOWS_X64: ${{ needs.build-release.outputs.windows-x64 }}
          DIGEST_UNSIGNED_ANDROID: ${{ needs.build-android.outputs.android }}
          DIGEST_UNSIGNED_RELAY_LINUX_X64: ${{ needs.build-relay.outputs.relay-linux-x64 }}
          DIGEST_UNSIGNED_RELAY_LINUX_ARM64: ${{ needs.build-relay.outputs.relay-linux-arm64 }}
        run: node apps/client/scripts/release/release-asset-digests.mjs collect dist/unsigned dist/release-assets unsigned-linux-x64 unsigned-windows-x64 unsigned-android unsigned-relay-linux-x64 unsigned-relay-linux-arm64

      - name: sign Android release assets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node apps/client/scripts/release/sign-android-release-assets.mjs

      - name: sign updater assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node apps/client/scripts/release/sign-tauri-release-assets.mjs

      # RPMs carry their own signature so dnf and zypper can require it with gpgcheck=1. Package
      # publication verifies the checksum signature, so assets changed on the draft release after
      # signing are never indexed or pushed to the AUR.
      - name: sign RPM packages and checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GANBARU_PACKAGE_REPO_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GANBARU_PACKAGE_REPO_GPG_PASSPHRASE }}
          GANBARU_PACKAGE_REPO_PUBLIC_KEY: ${{ vars.GANBARU_PACKAGE_REPO_PUBLIC_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GANBARU_PACKAGE_REPO_GPG_PRIVATE_KEY must be set"
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/checksum-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          if [ -z "$key_id" ]; then
            echo "Package repo signing key import did not produce a secret key"
            exit 1
          fi
          passphrase_file="$RUNNER_TEMP/checksum-gpg-passphrase"
          printf '%s' "$GPG_PASSPHRASE" > "$passphrase_file"
          chmod 600 "$passphrase_file"

          GANBARU_PACKAGE_REPO_GPG_KEY_ID="$key_id" \
            GANBARU_PACKAGE_REPO_GPG_PASSPHRASE_FILE="$passphrase_file" \
            node apps/client/scripts/release/sign-rpm-release-assets.mjs
          node apps/client/scripts/release/release-checksums.mjs write dist/release-assets
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passphrase_file" --local-user "$key_id" \
            --detach-sign --armor -o dist/release-assets/SHA256SUMS.asc dist/release-assets/SHA256SUMS
          rm -rf "$passphrase_file" "$GNUPGHOME"

      - name: upload signed assets
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-release-assets
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: github.event_name != 'release'
    name: publish draft release
    needs: sign-release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        # actions/setup-node v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: resolve release metadata
        id: release
        run: node apps/client/scripts/release/resolve-release-metadata.mjs

      - name: download signed assets
        # actions/download-artifact v7.0.0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: signed-release-assets
          path: dist/release-assets

      - name: write generated release notes
        env:
          RELEASE_TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          mkdir -p dist
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            -f configuration_file_path=".github/release.yml" \
            --jq .body > dist/generated-release-notes.md
          sed -i \
            -e "s/^## What's Changed$/## What's changed/" \
            -e "s/^\*\*Full Changelog\*\*:/\*\*Full changelog\*\*:/" \
            -e "s/^Full Changelog:/Full changelog:/" \
            dist/generated-release-notes.md
          cat .github/release-notes-template.md > dist/release-notes.md
          printf '\n\n' >> dist/release-notes.md
          cat dist/generated-release-notes.md >> dist/release-notes.md

      - name: write updater feed
        env:
          GANBARU_RELEASE_REPOSITORY: ${{ github.repository }}
          GANBARU_RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          GANBARU_RELEASE_NOTES_PATH: dist/generated-release-notes.md
        run: node apps/client/scripts/release/write-tauri-latest-json.mjs

      - name: create or update draft release
        env:
          RELEASE_TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
        run: |
          existing_draft="$(gh release view "$RELEASE_TAG_NAME" --json isDraft -q .isDraft 2>/dev/null || true)"
          if [ "$existing_draft" = "true" ]; then
            gh release edit "$RELEASE_TAG_NAME" --draft --title "$RELEASE_NAME" --notes-file dist/release-notes.md
          elif [ "$existing_draft" = "false" ]; then
            echo "Release $RELEASE_TAG_NAME already exists and is published"
            exit 1
          else
            gh release create "$RELEASE_TAG_NAME" --target "$GITHUB_SHA" --draft --title "$RELEASE_NAME" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG_NAME" dist/release-assets/* --clobber

  publish-package-repo:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'app-v')
    name: publish package repo
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    concurrency:
      group: package-repo
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GANBARU_PACKAGE_REPO_PUBLIC_KEY: ${{ vars.GANBARU_PACKAGE_REPO_PUBLIC_KEY }}
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        # actions/setup-node v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: install package repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c dpkg-dev gnupg

      - name: download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/release-assets
          gh release download "$RELEASE_TAG_NAME" --pattern "*.deb" --pattern "*.rpm" --pattern "SHA256SUMS" --pattern "SHA256SUMS.asc" --dir dist/release-assets

      - name: verify release packages
        run: node apps/client/scripts/release/release-checksums.mjs verify dist/release-assets

      - name: import package repo signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GANBARU_PACKAGE_REPO_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GANBARU_PACKAGE_REPO_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GANBARU_PACKAGE_REPO_GPG_PRIVATE_KEY must be set"
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/package-repo-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

          key_id="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          if [ -z "$key_id" ]; then
            echo "Package repo signing key import did not produce a secret key"
            exit 1
          fi

          passphrase_file="$RUNNER_TEMP/package-repo-gpg-passphrase"
          printf '%s' "$GPG_PASSPHRASE" > "$passphrase_file"
          chmod 600 "$passphrase_file"

          {
            echo "GNUPGHOME=$GNUPGHOME"
            echo "GANBARU_PACKAGE_REPO_GPG_KEY_ID=$key_id"
            echo "GANBARU_PACKAGE_REPO_GPG_PASSPHRASE_FILE=$passphrase_file"
          } >> "$GITHUB_ENV"

      - name: prepare Pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf dist/pages
          # The token reaches git only through per-command configuration, never a remote URL in .git/config.
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          git_with_token() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" git "$@"
          }
          if git_with_token ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git_with_token fetch origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add -B gh-pages dist/pages origin/gh-pages
          else
            mkdir -p dist/pages
            git -C dist/pages init
            git -C dist/pages checkout --orphan gh-pages
          fi
          if ! git -C dist/pages remote get-url origin >/dev/null 2>&1; then
            git -C dist/pages remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git -C dist/pages config user.name "github-actions[bot]"
          git -C dist/pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: build package repo
        env:
          GANBARU_PACKAGE_PAGES_DIR: dist/pages
        run: node apps/client/scripts/release/build-package-repo.mjs

      - name: push package repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C dist/pages add .nojekyll packages
          if git -C dist/pages diff --cached --quiet; then
            echo "Package repo is unchanged"
            exit 0
          fi
          git -C dist/pages commit -m "chore: update package repository for $RELEASE_TAG_NAME"
          # The token reaches git only through per-command configuration, never a remote URL in .git/config.
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          git_with_token() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" git "$@"
          }
          git_with_token -C dist/pages push origin HEAD:gh-pages

  publish-aur:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'app-v')
    name: publish AUR package
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      GANBARU_RELEASE_REPOSITORY: ${{ github.repository }}
      GANBARU_PACKAGE_REPO_PUBLIC_KEY: ${{ vars.GANBARU_PACKAGE_REPO_PUBLIC_KEY }}
    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        # actions/setup-node v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: download Debian release package
        run: |
          mkdir -p dist/release-assets
          gh release download "$RELEASE_TAG_NAME" --pattern "*.deb" --pattern "SHA256SUMS" --pattern "SHA256SUMS.asc" --dir dist/release-assets

      - name: verify Debian release package
        run: node apps/client/scripts/release/release-checksums.mjs verify dist/release-assets

      - name: configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY must be set"
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/ganbaru-aur-publish"
          chmod 600 "$HOME/.ssh/ganbaru-aur-publish"
          printf '%s\n' "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/ganbaru-aur-publish" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes aur@aur.archlinux.org help >/dev/null

      - name: clone AUR package
        run: |
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/ganbaru-aur-publish -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          mkdir -p dist/aur
          git clone ssh://aur@aur.archlinux.org/ganbaru-bin.git dist/aur/ganbaru-bin
          git -C dist/aur/ganbaru-bin config user.name "Victor Benito Garcia Rocha"
          git -C dist/aur/ganbaru-bin config user.email "victorbenitogr@gmail.com"

      - name: write AUR package files
        env:
          GANBARU_AUR_DIR: dist/aur/ganbaru-bin
        run: node apps/client/scripts/release/write-aur-package.mjs

      - name: push AUR package
        run: |
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/ganbaru-aur-publish -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git -C dist/aur/ganbaru-bin add PKGBUILD .SRCINFO .gitignore ganbaru-bin.install
          if git -C dist/aur/ganbaru-bin diff --cached --quiet; then
            echo "AUR package is unchanged"
            exit 0
          fi
          version="${RELEASE_TAG_NAME#app-v}"
          git -C dist/aur/ganbaru-bin commit -m "update to $version"
          git -C dist/aur/ganbaru-bin push origin HEAD:master

  # Publishes the relay container image once admins publish the release. It holds only the
  # GITHUB_TOKEN with packages: write and never enters the release environment, so the signing
  # secrets are unreachable. It builds nothing from source: it verifies the published relay
  # binaries against the signed SHA256SUMS and copies them into a scratch image.
  # check-signing-isolation.mjs enforces this.
  publish-relay-image:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'app-v')
    name: publish relay image
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    concurrency:
      group: relay-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      GANBARU_PACKAGE_REPO_PUBLIC_KEY: ${{ vars.GANBARU_PACKAGE_REPO_PUBLIC_KEY }}
    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        # actions/setup-node v6
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: download relay binaries
        run: |
          mkdir -p dist/release-assets
          gh release download "$RELEASE_TAG_NAME" --pattern "ganbaru-sync-relay_*" --pattern "SHA256SUMS" --pattern "SHA256SUMS.asc" --dir dist/release-assets

      - name: verify relay binaries
        run: node apps/client/scripts/release/release-checksums.mjs verify dist/release-assets

      - name: stage image context
        run: |
          version="${RELEASE_TAG_NAME#app-v}"
          context="dist/relay-image"
          mkdir -p "$context/linux-amd64" "$context/linux-arm64" "$context/data"
          install -m 0555 "dist/release-assets/ganbaru-sync-relay_${version}_linux_x86_64" "$context/linux-amd64/ganbaru-sync-relay"
          install -m 0555 "dist/release-assets/ganbaru-sync-relay_${version}_linux_aarch64" "$context/linux-arm64/ganbaru-sync-relay"
          cp crates/ganbaru-sync-relay/Containerfile "$context/Containerfile"

      - name: log in to GitHub Container Registry
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Each architecture is built and pushed with the default builder, then joined into one
      # index by digest, so no builder image or emulator is pulled.
      - name: build and push relay image
        run: |
          version="${RELEASE_TAG_NAME#app-v}"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/ganbaru-sync-relay"
          references=()
          for arch in amd64 arm64; do
            docker build \
              --platform "linux/$arch" \
              --file dist/relay-image/Containerfile \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$version" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
              --tag "$image:$version-$arch" \
              dist/relay-image
            docker push "$image:$version-$arch"
            references+=("$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$version-$arch")")
          done
          docker buildx imagetools create --tag "$image:$version" "${references[@]}"
          digest="sha256:$(docker buildx imagetools inspect --raw "$image:$version" | sha256sum | cut -d ' ' -f 1)"
          echo "Published $image@$digest"
          {
            echo "### Relay image"
            echo
            echo "\`$image@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
