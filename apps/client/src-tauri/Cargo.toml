[package]
name = "ganbaru-ai"
version = "0.1.9"
description = "Ganbaru AI Tauri application"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "ganbaru-ai"

[lib]
name = "ganbaru_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "ganbaru-ai"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { workspace = true }

[lints]
workspace = true

[dependencies]
ganbaru-tauri-app = { path = "app" }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
ganbaru-mobile-documents = { workspace = true }
ganbaru-mobile-distractions = { workspace = true }
ganbaru-mobile-media = { workspace = true }
ganbaru-mobile-notifications = { workspace = true }
tauri-plugin-notification = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
