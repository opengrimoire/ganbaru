[package]
name = "ganbaru-db"
version = "0.1.5"
description = "Ganbaru SQLite pool and migration services"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
# Exposes a once-per-process migrated template database for other crates' tests.
test-support = []

[dependencies]
sqlx = { workspace = true }
# Sets the floor for the SQLite library that sqlx bundles.
libsqlite3-sys = { workspace = true }
ganbaru-atomic-files = { workspace = true }
tokio = { workspace = true }
