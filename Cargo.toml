[workspace]
resolver = "3"
members = [
  "apps/client/src-tauri",
  "apps/client/src-tauri/app",
  "crates/ganbaru-atomic-files",
  "crates/ganbaru-calendar",
  "crates/ganbaru-chat",
  "crates/ganbaru-chat-contracts",
  "crates/ganbaru-chat-providers",
  "crates/ganbaru-civil-time",
  "crates/ganbaru-db",
  "crates/ganbaru-distractions",
  "crates/ganbaru-handoff",
  "crates/ganbaru-image-metadata",
  "crates/ganbaru-linking-firewall",
  "crates/ganbaru-mobile-documents",
  "crates/ganbaru-mobile-distractions",
  "crates/ganbaru-mobile-media",
  "crates/ganbaru-mobile-notifications",
  "crates/ganbaru-mobile-sync",
  "crates/ganbaru-music",
  "crates/ganbaru-music-library",
  "crates/ganbaru-music-player",
  "crates/ganbaru-native-messaging",
  "crates/ganbaru-notes",
  "crates/ganbaru-contacts",
  "crates/ganbaru-pomodoro",
  "crates/ganbaru-projects",
  "crates/ganbaru-quick-notes",
  "crates/ganbaru-sync",
  "crates/ganbaru-sync-contracts",
  "crates/ganbaru-sync-replica",
  "crates/ganbaru-themes",
  "crates/ganbaru-working-folders",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
authors = ["Ganbaru"]
license = "AGPL-3.0-only"

[workspace.lints.rust]
# Unsafe code is allowed only in modules listed in docs/data/security/unsafe-rust.md.
unsafe_code = "deny"

[workspace.lints.clippy]
# Nested guards and let-chains are both valid; choose by readability and scope.
collapsible_if = "allow"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
ammonia = "4.1.7"
axum = "0.8.8"
base64 = "0.22.1"
block2 = "0.6.2"
cairo-rs = { version = "0.18.5", features = ["png"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
dunce = "1.0.5"
flate2 = "1.1.9"
ganbaru-atomic-files = { path = "crates/ganbaru-atomic-files" }
ganbaru-calendar = { path = "crates/ganbaru-calendar" }
ganbaru-chat = { path = "crates/ganbaru-chat", default-features = false }
ganbaru-chat-contracts = { path = "crates/ganbaru-chat-contracts" }
ganbaru-chat-providers = { path = "crates/ganbaru-chat-providers" }
ganbaru-civil-time = { path = "crates/ganbaru-civil-time" }
ganbaru-db = { path = "crates/ganbaru-db" }
ganbaru-distractions = { path = "crates/ganbaru-distractions" }
ganbaru-handoff = { path = "crates/ganbaru-handoff" }
ganbaru-image-metadata = { path = "crates/ganbaru-image-metadata" }
ganbaru-mobile-documents = { path = "crates/ganbaru-mobile-documents" }
ganbaru-mobile-distractions = { path = "crates/ganbaru-mobile-distractions" }
ganbaru-mobile-media = { path = "crates/ganbaru-mobile-media" }
ganbaru-mobile-notifications = { path = "crates/ganbaru-mobile-notifications" }
ganbaru-mobile-sync = { path = "crates/ganbaru-mobile-sync" }
ganbaru-music = { path = "crates/ganbaru-music" }
ganbaru-music-library = { path = "crates/ganbaru-music-library" }
ganbaru-music-player = { path = "crates/ganbaru-music-player" }
ganbaru-notes = { path = "crates/ganbaru-notes" }
ganbaru-contacts = { path = "crates/ganbaru-contacts" }
ganbaru-pomodoro = { path = "crates/ganbaru-pomodoro" }
ganbaru-projects = { path = "crates/ganbaru-projects" }
ganbaru-quick-notes = { path = "crates/ganbaru-quick-notes" }
ganbaru-sync = { path = "crates/ganbaru-sync" }
ganbaru-sync-contracts = { path = "crates/ganbaru-sync-contracts" }
ganbaru-sync-replica = { path = "crates/ganbaru-sync-replica" }
ganbaru-themes = { path = "crates/ganbaru-themes" }
ganbaru-working-folders = { path = "crates/ganbaru-working-folders" }
gtk = "0.18"
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
hyper = { version = "1.10.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["service", "tokio"] }
if-addrs = { version = "=0.15.0", features = ["link-local"] }
jiff = { version = "0.2.37", default-features = false, features = [
  "std",
  "tz-system",
  "tzdb-zoneinfo",
  "tzdb-concatenated",
  "tzdb-bundle-platform",
] }
keyring = "4.1.5"
libc = "0.2"
libsqlite3-sys = { version = "0.37", default-features = false }
mdns-sd = { version = "=0.21.6", default-features = false }
notify = "=8.2.0"
notify-rust = "4"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSBitmapImageRep",
  "NSImage",
  "NSImageRep",
  "NSRunningApplication",
  "NSResponder",
  "NSWorkspace",
  "NSWindow",
  "libc",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFString",
  "objc2",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSObject",
  "NSGeometry",
  "NSObjCRuntime",
  "NSString",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "block2",
  "WKSnapshotConfiguration",
  "WKWebView",
] }
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rmcp = { version = "3.0.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rodio = { version = "0.22.2", default-features = false, features = [
  "playback",
  "symphonia-flac",
  "symphonia-mp3",
  "symphonia-isomp4",
  "symphonia-aac",
  "symphonia-alac",
  "symphonia-ogg",
  "symphonia-vorbis",
  "symphonia-wav",
  "symphonia-pcm",
] }
rustix = { version = "1.1.4", default-features = false, features = ["std", "process", "fs"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
qrcode = { version = "0.14.1", default-features = false }
quircs = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
socket2 = "0.6.4"
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "sqlite-deserialize", "runtime-tokio", "macros", "migrate", "json"] }
tauri = { version = "~2.11.1" }
tauri-build = { version = "~2.6.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.48", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
url = "2.5.8"
wayland-client = "0.31.14"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
webkit2gtk = "2.0.2"
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
  "Foundation",
  "Media",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
x11rb = "0.13.2"
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "1.8.2"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[profile.dev]
debug = "line-tables-only"

# The Notes HTML sanitizer stack dominates import time and is too slow for import tests when unoptimized.
[profile.dev.package.ammonia]
opt-level = 3

[profile.dev.package.html5ever]
opt-level = 3

[profile.dev.package.markup5ever]
opt-level = 3

[profile.dev.package.tendril]
opt-level = 3

[profile.dev.package.string_cache]
opt-level = 3

# Every database test applies the migration chain, which costs about twice as much against unoptimized bundled SQLite.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
