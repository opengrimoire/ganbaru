<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Ganbaru AI</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="/src/app.css" />
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      #vault-ownership-transition-cover[hidden] {
        display: none;
      }

      #vault-ownership-transition-cover {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 30px 19px;
        background: rgb(0 0 0 / 0.55);
        color: rgb(255 255 255 / 0.92);
        font-family: "Inter Variable", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      #vault-ownership-transition-cover.android-system-font {
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      .vault-ownership-transition-content {
        display: flex;
        width: 100%;
        max-width: 480px;
        flex-direction: column;
        align-items: center;
      }

      .vault-ownership-transition-copy {
        text-shadow: 0 1px 3px rgb(0 0 0 / 0.45);
      }

      #vault-ownership-transition-title {
        margin: 0;
        font-size: 24.75px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.035em;
      }

      #vault-ownership-transition-description {
        max-width: 360px;
        margin: 11.25px 0 0;
        color: rgb(255 255 255 / 0.78);
        font-size: 14px;
        line-height: 22.5px;
      }

      .vault-ownership-transition-actions {
        display: flex;
        width: 100%;
        max-width: 300px;
        flex-direction: column;
        align-items: center;
        gap: 7.5px;
        margin-top: 26.25px;
      }

      .vault-ownership-transition-primary,
      .vault-ownership-transition-secondary {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        font-size: 13.5px;
        font-weight: 600;
      }

      .vault-ownership-transition-primary {
        width: 100%;
        min-height: 45px;
        gap: 7.5px;
        border-radius: 7.5px;
        background: white;
        color: #111217;
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);
      }

      .vault-ownership-transition-secondary {
        min-height: 41.25px;
        color: rgb(255 255 255 / 0.68);
        font-size: 13px;
        font-weight: 500;
      }

      .vault-ownership-transition-spinner {
        width: 13.5px;
        height: 13.5px;
        border: 2px solid rgb(17 18 23 / 0.22);
        border-top-color: #111217;
        border-radius: 9999px;
        animation: vault-ownership-transition-spin 0.8s linear infinite;
      }

      @keyframes vault-ownership-transition-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .vault-ownership-transition-spinner { animation: none; }
      }

      @media (min-width: 640px) {
        #vault-ownership-transition-title { font-size: 28.5px; }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <div
      id="vault-ownership-transition-cover"
      data-storage-key="ganbaru:vault-ownership-transition"
      role="status"
      hidden
    >
      <div class="vault-ownership-transition-content">
        <h1 id="vault-ownership-transition-title" class="vault-ownership-transition-copy"></h1>
        <p id="vault-ownership-transition-description" class="vault-ownership-transition-copy"></p>
        <div class="vault-ownership-transition-actions">
          <div class="vault-ownership-transition-primary">
            <span class="vault-ownership-transition-spinner" aria-hidden="true"></span>
            <span id="vault-ownership-transition-action"></span>
          </div>
          <div id="vault-ownership-transition-secondary" class="vault-ownership-transition-secondary"></div>
        </div>
      </div>
    </div>
    <script>
      try {
        const cover = document.getElementById("vault-ownership-transition-cover");
        if (/Android/i.test(navigator.userAgent)) {
          cover.classList.add("android-system-font");
        }
        const raw = sessionStorage.getItem("ganbaru:vault-ownership-transition");
        const snapshot = raw ? JSON.parse(raw) : null;
        if (
          snapshot
          && typeof snapshot.title === "string"
          && typeof snapshot.description === "string"
          && typeof snapshot.actionLabel === "string"
          && typeof snapshot.secondaryLabel === "string"
        ) {
          document.getElementById("vault-ownership-transition-title").textContent = snapshot.title;
          document.getElementById("vault-ownership-transition-description").textContent = snapshot.description;
          document.getElementById("vault-ownership-transition-action").textContent = snapshot.actionLabel;
          document.getElementById("vault-ownership-transition-secondary").textContent = snapshot.secondaryLabel;
          cover.hidden = false;
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
