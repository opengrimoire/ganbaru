name: check

on:
  pull_request:
    branches:
      - main
      - dev
  # Pushes to dev only refresh the Rust dependency cache that pull requests restore.
  push:
    branches:
      - dev
  merge_group:
    types:
      - checks_requested

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux-rust:
    name: linux Rust validation
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install

      - name: install pinned Rust toolchain
        run: rustup show

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      # Only trusted pushes to dev save this cache. Pull requests and the merge queue
      # restore it read-only; a push without an exact match builds cold so stale
      # artifacts never accumulate in the saved cache.
      - name: restore Rust dependency cache
        id: rust-cache
        # actions/cache/restore v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.event_name != 'push' && format('rust-{0}-{1}-', runner.os, hashFiles('rust-toolchain.toml')) || '' }}

      - name: fetch Rust dependencies
        run: cargo fetch --locked

      - name: validate Rust workspace
        run: .github/scripts/with-memory-peak.sh pnpm -w run validate:rust

      - name: drop workspace build artifacts from the cache
        if: github.event_name == 'push' && steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf target/debug/incremental
          rm -rf target/debug/deps/*ganbaru* target/debug/.fingerprint/ganbaru* target/debug/build/ganbaru*
          rm -f target/debug/ganbaru* target/debug/libganbaru*

      - name: save Rust dependency cache
        if: github.event_name == 'push' && steps.rust-cache.outputs.cache-hit != 'true'
        # actions/cache/save v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  linux-frontend:
    name: linux frontend validation
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: validate frontend workspace
        run: .github/scripts/with-memory-peak.sh pnpm -w run validate:frontend

  # Required status check name in the branch rulesets; passes only when both Linux jobs pass.
  linux:
    name: linux validation
    if: always() && github.event_name != 'push'
    needs:
      - linux-rust
      - linux-frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require Rust and frontend validation
        env:
          RUST_RESULT: ${{ needs.linux-rust.result }}
          FRONTEND_RESULT: ${{ needs.linux-frontend.result }}
        run: |
          echo "Rust: $RUST_RESULT, frontend: $FRONTEND_RESULT"
          [ "$RUST_RESULT" = success ] && [ "$FRONTEND_RESULT" = success ]

  windows-rust:
    name: windows Rust check
    if: github.event_name != 'push'
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: install pinned Rust toolchain
        run: rustup show

      - name: fetch Rust dependencies
        run: cargo fetch --locked

      - name: lint Windows Rust
        run: cargo clippy -p ganbaru -p ganbaru-tauri-app -p ganbaru-chat -p ganbaru-chat-providers -p ganbaru-native-messaging --locked --all-targets -- -D warnings

  android:
    name: Android ARM64 build
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-Dwarnings"
      # Published SHA-256 of the command line tools archive (developer.android.com/studio).
      ANDROID_COMMAND_LINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
      ANDROID_COMMAND_LINE_TOOLS_SHA256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: install Java 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"

      - name: enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install

      - name: install pinned Rust toolchain and Android target
        run: |
          rustup show
          rustup target add aarch64-linux-android

      - name: install Android command line tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          command_line_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$command_line_tools/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL "$ANDROID_COMMAND_LINE_TOOLS_URL" -o "$RUNNER_TEMP/android-commandline-tools.zip"
            echo "$ANDROID_COMMAND_LINE_TOOLS_SHA256  $RUNNER_TEMP/android-commandline-tools.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            set +o pipefail
            yes | "$command_line_tools/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1
            set -o pipefail
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$command_line_tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: install pinned Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;30.0.15729638"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.15729638" >> "$GITHUB_ENV"

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: fetch Rust dependencies
        run: cargo fetch --locked

      - name: validate committed Android project
        run: pnpm --dir apps/client run check:android-project

      - name: build Android ARM64 debug APK
        run: pnpm --dir apps/client tauri android build --debug --apk --target aarch64 --ci

      - name: upload Android development APK
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-arm64-development
          path: apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 7
