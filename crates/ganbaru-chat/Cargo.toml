[package]
name = "ganbaru-chat"
version = "0.1.5"
description = "Ganbaru AI Chat application service"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[features]
default = ["native-runtime"]
native-runtime = ["dep:ganbaru-chat-providers"]
test-support = ["native-runtime"]

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
ganbaru-chat-contracts = { workspace = true }
ganbaru-chat-providers = { workspace = true, optional = true }
ganbaru-working-folders = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[dev-dependencies]
ganbaru-db = { workspace = true }
