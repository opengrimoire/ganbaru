[package]
name = "ganbaru-sync-replica"
version = "0.1.0"
description = "Ganbaru vault replica sync: installation writer keys, guarded access, carry-forward, recovery, the hub and client exchange, asset collection, and vault archives"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
ganbaru-atomic-files = { workspace = true }
ganbaru-db = { workspace = true }
ganbaru-handoff = { workspace = true }
ganbaru-contacts = { workspace = true }
ganbaru-sync = { workspace = true }
ganbaru-sync-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
zip = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { workspace = true }

[dev-dependencies]
ganbaru-db = { workspace = true, features = ["test-support"] }
ganbaru-music-library = { workspace = true }
ganbaru-projects = { workspace = true }
ganbaru-quick-notes = { workspace = true }
ganbaru-themes = { workspace = true }
